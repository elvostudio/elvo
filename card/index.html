<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELVO</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #050505;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .logo {
      font-size: 52px;
      font-weight: 900;
      letter-spacing: 8px;
      margin-bottom: 8px;
    }

    .text {
      color: #888;
      margin-bottom: 35px;
      font-size: 15px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 18px;
      margin: 14px 0;
      border: 1px solid #292929;
      border-radius: 16px;
      background: #111;
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
      transition: 0.2s;
    }

    .button:hover {
      background: #1d1d1d;
      transform: translateY(-2px);
    }

    .footer {
      margin-top: 35px;
      color: #555;
      font-size: 12px;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">ELVO</div>

    <div class="text">
      Choose where you want to go
    </div>

    <a class="button" href="https://elvostudio.github.io/elvo/">
      🌐 WEBSITE
    </a>

    <a class="button" href="https://www.instagram.com/store_elvo/">
      📸 INSTAGRAM
    </a>

    <a class="button" href="https://www.tiktok.com/@store_elvo">
      🎵 TIKTOK
    </a>

    <div class="footer">
      ELVO © 2026
    </div>

  </div>

</body>
      </html>
